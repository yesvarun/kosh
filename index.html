<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kosh — Dictionary &amp; Vocabulary</title>
<meta name="description" content="Look up words anywhere on your phone, save them, and review them later.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2F5D50">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<script>
  // Runs before the body paints, so a dark or sepia theme doesn't flash white first.
  (function(){
    try{
      var t = localStorage.getItem("kosh_theme");
      if(t && t !== "paper"){ document.documentElement.setAttribute("data-theme", t); }
    }catch(e){}
  })();
</script>
<style>
  :root{
    --paper:#F2EFE7;
    --surface:#FBFAF6;
    --ink:#1C231F;
    --ink-soft:#5B665D;
    --accent:#2F5D50;
    --accent-soft:#DCE7E0;
    --gold:#C79A3D;
    --line:#D8D2C4;
    --danger:#A6432F;
    --texture:none;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* Sepia — warm, low-glare, for long reading */
  [data-theme="sepia"]{
    --paper:#EDE0C8;
    --surface:#F6EDDA;
    --ink:#3B2F21;
    --ink-soft:#7A6A53;
    --accent:#8A5A2B;
    --accent-soft:#E3D2B4;
    --gold:#B07D30;
    --line:#D6C3A1;
    --danger:#9C3B22;
  }

  /* Rough old paper — aged stock with a fibre texture generated in-page,
     so it costs no extra download. */
  [data-theme="oldpaper"]{
    --paper:#DFD3B8;
    --surface:#E9DEC5;
    --ink:#2E2519;
    --ink-soft:#6B5C44;
    --accent:#6B4A22;
    --accent-soft:#D6C6A4;
    --gold:#9C7526;
    --line:#C0AE8A;
    --danger:#8E3A1E;
    --texture:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.13'/></svg>");
  }

  /* Charcoal — black and gray for night use */
  [data-theme="charcoal"]{
    --paper:#141414;
    --surface:#1D1D1D;
    --ink:#E8E6E1;
    --ink-soft:#9A9A94;
    --accent:#8FB3A4;
    --accent-soft:#2A2F2C;
    --gold:#C79A3D;
    --line:#333333;
    --danger:#E08268;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:var(--texture);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .2s ease, color .2s ease;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    background-image:var(--texture);
  }
  header.top{
    padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 0 20px;
  }
  .brand-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .theme-toggle{
    flex-shrink:0;
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:17px;
    cursor:pointer;
    line-height:1;
  }
  .theme-row{
    display:flex;
    gap:6px;
    margin-bottom:14px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:2px;
  }
  .theme-row[hidden]{display:none;}
  .swatch{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-family:var(--sans);
    font-size:12.5px;
    padding:7px 11px;
    border-radius:16px;
    cursor:pointer;
    white-space:nowrap;
  }
  .swatch.active{
    border-color:var(--accent);
    color:var(--accent);
    font-weight:600;
  }
  .dot{
    width:13px; height:13px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,.22);
    display:inline-block;
  }
  .dot-paper{background:#F2EFE7;}
  .dot-sepia{background:#EDE0C8;}
  .dot-oldpaper{background:#DFD3B8;}
  .dot-charcoal{background:#141414;}

  .brand{
    font-family:var(--serif);
    font-style:italic;
    font-size:26px;
    letter-spacing:0.2px;
    margin:0 0 2px 0;
  }
  .brand b{font-style:normal; font-weight:700;}
  .tagline{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 16px 0;
  }
  nav.tabs{
    display:flex;
    padding:0 16px;
    gap:6px;
  }
  nav.tabs button{
    flex:1;
    border:none;
    background:var(--accent-soft);
    color:var(--ink-soft);
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    padding:10px 8px 12px 8px;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  nav.tabs button.active{
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 -1px 0 var(--line) inset;
  }
  main{
    flex:1;
    background:var(--surface);
    background-image:var(--texture);
    padding:20px 20px 40px 20px;
    border-top:1px solid var(--line);
  }
  .view{display:none;}
  .view.active{display:block;}

  /* --- Lookup view --- */
  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    width:100%;
  }
  input[type="text"]{
    flex:1 1 auto;
    min-width:0;              /* without this a flex item won't shrink below its
                                 content width and pushes the button off-screen */
    font-family:var(--sans);
    font-size:16px;           /* 16px stops iOS/Android zooming on focus */
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
  }
  input[type="text"]:focus{outline:2px solid var(--accent); outline-offset:1px;}
  button.primary{
    flex:0 0 auto;
    white-space:nowrap;
    font-family:var(--sans);
    font-size:15px;
    font-weight:600;
    background:var(--accent);
    color:var(--surface);
    border:none;
    padding:12px 16px;
    border-radius:8px;
    cursor:pointer;
  }
  button.primary:active{opacity:0.85;}
  .lang-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
  }
  .lang-row span{font-size:12px; color:var(--ink-soft);}
  select{
    font-family:var(--sans);
    font-size:13px;
    padding:5px 8px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }
  .status{
    font-size:14px;
    color:var(--ink-soft);
    padding:20px 0;
  }
  .status.error{color:var(--danger);}
  .offline-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:-10px 0 20px 0;
    padding:9px 11px;
    background:var(--accent-soft);
    border-radius:7px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .offline-row button{
    border:1px solid var(--accent);
    background:transparent;
    color:var(--accent);
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:600;
    padding:5px 11px;
    border-radius:6px;
    cursor:pointer;
    flex-shrink:0;
  }
  .source-tag{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:14px;
    padding-top:8px;
    border-top:1px dotted var(--line);
  }
  .rel-block{
    margin-top:20px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .rel-group{margin-bottom:12px;}
  .rel-label{
    font-family:var(--serif);
    font-style:italic;
    font-size:13.5px;
    color:var(--accent);
    display:block;
    margin-bottom:6px;
  }
  .rel-words{display:flex; flex-wrap:wrap; gap:6px;}
  .rel-word, .suggestion{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:13px;
    padding:6px 11px;
    border-radius:14px;
    cursor:pointer;
  }
  .rel-word:active, .suggestion:active{background:var(--accent-soft);}
  .suggestions{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px;}
  .suggestion{border-color:var(--accent); color:var(--accent);}
  .pending-note{
    margin-top:18px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .block-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:26px 0 4px 0;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .block-divider::before,
  .block-divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .entry-compact{border-top:none;}
  .online-block .entry{border-top:none; padding-top:4px;}

  .entry{border-top:1px solid var(--line); padding-top:18px;}
  .entry-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .entry-word{
    font-family:var(--serif);
    font-size:32px;
    font-weight:700;
    margin:0;
  }
  .entry-phon{
    font-size:15px;
    color:var(--ink-soft);
  }
  .audio-btn{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:50%;
    width:30px; height:30px;
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:14px;
    color:var(--accent);
    flex-shrink:0;
  }
  .audio-btn:active{background:var(--accent-soft);}
  .audio-btn.small{width:26px; height:26px; font-size:11px;}
  .syllables{
    font-size:12px;
    color:var(--ink-soft);
  }
  .accent-tag{
    font-size:11px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:9px;
    padding:1px 7px;
  }
  .word-row-actions{
    display:flex;
    align-items:center;
    gap:4px;
    flex-shrink:0;
  }
  .review-speak{
    width:38px; height:38px;
    font-size:15px;
    margin-top:16px;
  }
  .pos{
    font-family:var(--serif);
    font-style:italic;
    font-size:15px;
    color:var(--accent);
    margin:18px 0 6px 0;
  }
  ol.defs{
    margin:0;
    padding-left:20px;
  }
  ol.defs li{
    margin-bottom:8px;
    font-size:15px;
    line-height:1.5;
  }
  .example{
    color:var(--ink-soft);
    font-size:13.5px;
    font-style:italic;
  }
  .synonyms{
    margin-top:6px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .synonyms b{color:var(--ink);}
  .save-btn{
    margin-top:22px;
    width:100%;
    padding:13px;
    border-radius:8px;
    border:1px solid var(--accent);
    background:var(--surface);
    color:var(--accent);
    font-family:var(--sans);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  .save-btn.saved{
    background:var(--accent);
    color:var(--surface);
    border-color:var(--accent);
  }
  .shared-note{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
    padding:8px 10px;
    background:var(--accent-soft);
    border-radius:6px;
  }

  /* --- Saved view --- */
  .saved-summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .saved-count{font-size:14px; color:var(--ink-soft);}
  .saved-count b{color:var(--ink);}
  .review-btn{
    background:var(--gold);
    color:var(--ink);
    border:none;
    font-weight:700;
    font-size:14px;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
  }
  .review-btn:disabled{
    background:var(--line);
    color:var(--ink-soft);
    cursor:default;
  }
  .filter-row{margin-bottom:14px;}
  .filter-row input{width:100%;}
  ul.word-list{list-style:none; margin:0 0 22px 0; padding:0;}
  .date-heading{
    font-family:var(--serif);
    font-style:italic;
    font-size:14px;
    color:var(--accent);
    margin-bottom:2px;
  }
  li.word-row{
    border-top:1px solid var(--line);
    padding:12px 0;
  }
  li.word-row:last-child{border-bottom:1px solid var(--line);}
  .word-row-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
  }
  .word-row-left{display:flex; align-items:center; gap:10px;}
  .box-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--line);
    flex-shrink:0;
  }
  .box-dot.due{background:var(--gold);}
  .word-row-word{font-family:var(--serif); font-size:17px; font-weight:700;}
  .word-row-pos{font-size:12px; color:var(--ink-soft);}
  .word-row-del{
    border:none; background:none; color:var(--danger);
    font-size:13px; cursor:pointer; padding:4px 6px;
  }
  .word-row-body{
    display:none;
    padding-top:10px;
  }
  .word-row-body.open{display:block;}
  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }
  .empty-state p{font-size:14px; line-height:1.6;}

  /* --- Review overlay --- */
  #review-overlay{
    position:fixed;
    inset:0;
    background:var(--paper);
    display:none;
    flex-direction:column;
    z-index:50;
  }
  #review-overlay.active{display:flex;}
  .review-top{
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .review-progress{font-size:13px; color:var(--ink-soft);}
  .review-close{
    border:none; background:none; font-size:22px; color:var(--ink-soft); cursor:pointer;
    line-height:1;
  }
  .review-card{
    flex:1;
    margin:10px 20px 20px 20px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px;
    text-align:center;
    cursor:pointer;
  }
  .review-word{
    font-family:var(--serif);
    font-size:34px;
    font-weight:700;
  }
  .review-hint{
    margin-top:14px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .review-back{display:none; text-align:left; width:100%;}
  .review-back.show{display:block;}
  .review-back .pos{margin-top:14px;}
  .review-buttons{
    display:flex;
    gap:10px;
    padding:0 20px calc(env(safe-area-inset-bottom,0px) + 20px) 20px;
  }
  .review-buttons button{
    flex:1;
    padding:15px;
    border-radius:10px;
    border:none;
    font-family:var(--sans);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .btn-again{background:var(--accent-soft); color:var(--ink);}
  .btn-good{background:var(--accent); color:var(--surface);}
  .review-done{
    text-align:center;
    padding:30px;
  }
  .review-done .brand{margin-bottom:6px;}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="brand-row">
      <div>
        <p class="brand"><b>Kosh</b> — a dictionary</p>
        <p class="tagline">Look up a word anywhere. Study it later.</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" title="Reading theme" aria-label="Reading theme">◐</button>
    </div>
    <div id="theme-row" class="theme-row" hidden>
      <button class="swatch" data-theme-set="paper"><span class="dot dot-paper"></span>Paper</button>
      <button class="swatch" data-theme-set="sepia"><span class="dot dot-sepia"></span>Sepia</button>
      <button class="swatch" data-theme-set="oldpaper"><span class="dot dot-oldpaper"></span>Old paper</button>
      <button class="swatch" data-theme-set="charcoal"><span class="dot dot-charcoal"></span>Charcoal</button>
    </div>
  </header>

  <nav class="tabs">
    <button id="tab-lookup" class="active">Lookup</button>
    <button id="tab-saved">Saved <span id="due-badge"></span></button>
  </nav>

  <main>
    <section id="view-lookup" class="view active">
      <div id="protocol-warning-slot"></div>
      <div id="shared-note-slot"></div>
      <div class="search-row">
        <input type="text" id="search-input" placeholder="Type a word…" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="search" enterkeyhint="search">
        <button class="primary" id="search-btn">Look up</button>
      </div>
      <div class="lang-row">
        <span>Language</span>
        <select id="lang-select">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
        </select>
      </div>
      <div class="offline-row">
        <span id="offline-status">Offline dictionary: checking…</span>
        <button id="offline-btn" style="display:none;">Download</button>
      </div>
      <div id="result-slot"></div>
    </section>

    <section id="view-saved" class="view">
      <div class="saved-summary">
        <div class="saved-count" id="saved-count">0 words saved</div>
        <button class="review-btn" id="start-review-btn" disabled>Start review</button>
      </div>
      <div class="filter-row">
        <input type="text" id="filter-input" placeholder="Filter saved words…" autocomplete="off">
      </div>
      <div id="saved-list-slot"></div>
    </section>
  </main>
</div>

<div id="review-overlay">
  <div class="review-top">
    <span class="review-progress" id="review-progress"></span>
    <button class="review-close" id="review-close">✕</button>
  </div>
  <div id="review-body-slot" style="flex:1; display:flex; flex-direction:column;"></div>
</div>

<audio id="audio-player"></audio>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "kosh_words_v1";
  var BOX_INTERVAL_DAYS = {1:0, 2:1, 3:3, 4:7, 5:14};

  // ---------- storage ----------
  function loadWords(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveWords(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  function wordId(word, lang){ return lang + ":" + word.toLowerCase(); }

  var words = loadWords();

  // ---------- reading theme ----------
  var THEME_KEY = "kosh_theme";
  var THEME_BAR = { paper:"#2F5D50", sepia:"#8A5A2B", oldpaper:"#6B4A22", charcoal:"#141414" };
  var themeToggle = document.getElementById("theme-toggle");
  var themeRow = document.getElementById("theme-row");

  function applyTheme(name){
    if(name === "paper"){
      document.documentElement.removeAttribute("data-theme");
    } else {
      document.documentElement.setAttribute("data-theme", name);
    }
    // Keep the phone's status bar in step with the theme.
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta){ meta.setAttribute("content", THEME_BAR[name] || THEME_BAR.paper); }
    Array.prototype.forEach.call(document.querySelectorAll("[data-theme-set]"), function(b){
      b.classList.toggle("active", b.getAttribute("data-theme-set") === name);
    });
    try{ localStorage.setItem(THEME_KEY, name); }catch(e){}
  }

  themeToggle.addEventListener("click", function(){
    themeRow.hidden = !themeRow.hidden;
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-theme-set]"), function(b){
    b.addEventListener("click", function(){
      applyTheme(b.getAttribute("data-theme-set"));
    });
  });

  // ---------- tabs ----------
  var tabLookup = document.getElementById("tab-lookup");
  var tabSaved = document.getElementById("tab-saved");
  var viewLookup = document.getElementById("view-lookup");
  var viewSaved = document.getElementById("view-saved");

  function showTab(name){
    if(name === "saved"){
      tabSaved.classList.add("active");
      tabLookup.classList.remove("active");
      viewSaved.classList.add("active");
      viewLookup.classList.remove("active");
      renderSavedList();
    } else {
      tabLookup.classList.add("active");
      tabSaved.classList.remove("active");
      viewLookup.classList.add("active");
      viewSaved.classList.remove("active");
    }
  }
  tabLookup.addEventListener("click", function(){ showTab("lookup"); });
  tabSaved.addEventListener("click", function(){ showTab("saved"); });

  // ---------- lookup ----------
  var searchInput = document.getElementById("search-input");
  var searchBtn = document.getElementById("search-btn");
  var langSelect = document.getElementById("lang-select");
  var resultSlot = document.getElementById("result-slot");
  var audioPlayer = document.getElementById("audio-player");

  var currentEntryData = null; // {word, lang, phonetic, audio, meanings}

  function apiCodeForLang(lang){
    return lang === "hi" ? "hi" : "en";
  }

  // ================= offline dictionary =================
  // The bundled dictionary lives in ./dict/ as one JSON file per starting letter
  // (a.json … z.json) plus index.json listing them. Shards are fetched on demand
  // and kept in the Cache Storage API, so lookups work with no network at all.
  var DICT_CACHE = "kosh-dict-v1";
  var shardMemory = {};   // letter -> parsed object, so repeat lookups are instant
  var dictIndex = null;   // {shards:[...], words:N, source:"..."} once loaded

  function shardFor(word){
    var c = word.trim().charAt(0).toLowerCase();
    return (c >= "a" && c <= "z") ? c : "_";
  }

  // Cache first, network second. Returns null if the shard is neither cached nor
  // reachable — that's a normal state before the offline download has been run.
  function getShard(letter){
    if(shardMemory[letter] !== undefined){ return Promise.resolve(shardMemory[letter]); }
    var path = "./dict/" + letter + ".json";
    var fromCache = ("caches" in window)
      ? caches.open(DICT_CACHE).then(function(c){ return c.match(path); })
      : Promise.resolve(null);

    return fromCache.then(function(res){
      if(res){ return res; }
      return fetch(path).then(function(r){
        if(!r.ok){ return null; }
        if("caches" in window){
          var copy = r.clone();
          caches.open(DICT_CACHE).then(function(c){ c.put(path, copy); });
        }
        return r;
      });
    }).then(function(res){
      if(!res){ shardMemory[letter] = null; return null; }
      return res.json().then(function(json){
        shardMemory[letter] = json;
        return json;
      });
    }).catch(function(){
      shardMemory[letter] = null;
      return null;
    });
  }

  function fetchLocal(word, lang){
    if(apiCodeForLang(lang) !== "en"){ return Promise.resolve({status:"not-found"}); }
    return getShard(shardFor(word)).then(function(shard){
      if(!shard){ return {status:"not-found"}; }
      var meanings = shard[word.trim().toLowerCase()];
      if(!meanings || !meanings.length){ return {status:"not-found"}; }
      return { status:"found", entry: {
        word: word.trim().toLowerCase(),
        phonetic: "",
        audio: "",
        meanings: meanings,
        source: "offline"
      }};
    });
  }

  function loadDictIndex(){
    var path = "./dict/index.json";
    var fromCache = ("caches" in window)
      ? caches.open(DICT_CACHE).then(function(c){ return c.match(path); })
      : Promise.resolve(null);
    return fromCache.then(function(res){
      return res || fetch(path);
    }).then(function(res){
      if(!res || !res.ok){ return null; }
      return res.json();
    }).catch(function(){ return null; });
  }

  var offlineStatusEl = document.getElementById("offline-status");
  var offlineBtn = document.getElementById("offline-btn");
  var OFFLINE_FLAG = "kosh_offline_ready";

  function refreshOfflineStatus(){
    loadDictIndex().then(function(index){
      if(!index){
        offlineStatusEl.textContent = "Offline dictionary: not installed. Run the build workflow to add ./dict/.";
        offlineBtn.style.display = "none";
        return;
      }
      dictIndex = index;
      if(!("caches" in window)){
        offlineStatusEl.textContent = "Offline dictionary available (" + index.words.toLocaleString() + " words). This browser can't store it.";
        offlineBtn.style.display = "none";
        return;
      }
      // A completed download sets a flag. Counting cached files was unreliable:
      // if any single shard 404'd the count never matched and the button was
      // stuck on "Finish download" forever.
      if(localStorage.getItem(OFFLINE_FLAG) === index.source + "|" + index.words){
        offlineStatusEl.textContent = index.words.toLocaleString() + " words stored on this phone — lookups work offline.";
        offlineBtn.textContent = "Remove";
        offlineBtn.style.display = "";
        offlineBtn.onclick = removeOffline;
      } else {
        offlineStatusEl.textContent = index.words.toLocaleString() + " words available offline (~" + index.approx_mb + " MB, one-time).";
        offlineBtn.textContent = "Download";
        offlineBtn.style.display = "";
        offlineBtn.onclick = downloadOffline;
      }
    });
  }

  function downloadOffline(){
    if(!dictIndex){ return; }
    offlineBtn.style.display = "none";
    var files = dictIndex.shards.concat(["index"]);
    var done = 0, failed = 0;
    offlineStatusEl.textContent = "Downloading dictionary… 0%";
    caches.open(DICT_CACHE).then(function(cache){
      // Sequential, not parallel — kinder to a phone connection, real progress.
      return files.reduce(function(chain, letter){
        return chain.then(function(){
          return cache.add("./dict/" + letter + ".json").catch(function(){ failed++; }).then(function(){
            done++;
            offlineStatusEl.textContent = "Downloading dictionary… " + Math.round(done / files.length * 100) + "%";
          });
        });
      }, Promise.resolve());
    }).then(function(){
      shardMemory = {};
      if(failed === files.length){
        offlineStatusEl.textContent = "Download failed. Check your connection and try again.";
        offlineBtn.textContent = "Retry";
        offlineBtn.style.display = "";
        offlineBtn.onclick = downloadOffline;
        return;
      }
      // Everything reachable was fetched — mark it done so the button settles.
      localStorage.setItem(OFFLINE_FLAG, dictIndex.source + "|" + dictIndex.words);
      refreshOfflineStatus();
    });
  }

  function removeOffline(){
    caches.delete(DICT_CACHE).then(function(){
      localStorage.removeItem(OFFLINE_FLAG);
      shardMemory = {};
      refreshOfflineStatus();
    });
  }

  // Pronunciation fallback. dictionaryapi.dev only has IPA/audio for the small
  // set of words it covers, so for everything else we ask Datamuse for the IPA
  // transcription and syllable count (qe=sp echoes the queried word back so we
  // get metadata for that exact word rather than a near match).
  function fetchPronunciation(word){
    var url = "https://api.datamuse.com/words?sp=" + encodeURIComponent(word) +
              "&qe=sp&md=rs&ipa=1&max=1";
    return fetch(url).then(function(r){ return r.ok ? r.json() : []; })
      .then(function(list){
        if(!list.length || !list[0].tags){ return {}; }
        var out = {};
        list[0].tags.forEach(function(t){
          if(t.indexOf("pron:") === 0){ out.phonetic = "/" + t.slice(5) + "/"; }
        });
        if(list[0].numSyllables){ out.syllables = list[0].numSyllables; }
        return out;
      }).catch(function(){ return {}; });
  }

  // Speaks the word using the phone's own text-to-speech. Always available,
  // works with no network, and covers every word — unlike the recorded mp3s,
  // which exist only for a fraction of entries.
  function speakWord(word, lang){
    if(!("speechSynthesis" in window)){ return false; }
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(word);
      u.lang = (lang === "hi") ? "hi-IN" : "en-GB";
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // Wiktionary's fields (definitions/examples) contain inline HTML (links, etc).
  // Parse it as an element and read textContent — this only extracts plain text,
  // it never re-inserts the markup, so it's safe even though the source is untrusted.
  function stripHtml(html){
    var div = document.createElement("div");
    div.innerHTML = html || "";
    return (div.textContent || div.innerText || "").trim();
  }

  // ================= online sources =================
  // Wiktionary is the lead source: it is by far the most comprehensive free
  // dictionary (etymology-aware, covers slang, inflected forms, technical terms).
  // dictionaryapi.dev is kept ONLY for its IPA + audio, which Wiktionary's REST
  // endpoint doesn't provide. Datamuse adds synonyms/antonyms/related words and
  // spelling suggestions. All three run in parallel and are merged.

  function fetchWiktionary(word, lang){
    var url = "https://en.wiktionary.org/api/rest_v1/page/definition/" + encodeURIComponent(word.toLowerCase());
    return fetch(url).then(function(res){
      if(res.status === 404){ return {status:"not-found"}; }
      if(!res.ok){ return {status:"error"}; }
      return res.json().then(function(data){
        var entries = data[apiCodeForLang(lang)];
        if(!entries || !entries.length){ return {status:"not-found"}; }
        var meanings = entries.slice(0,8).map(function(m){
          return {
            partOfSpeech: m.partOfSpeech || "",
            definitions: (m.definitions || []).slice(0,6).map(function(d){
              var example = "";
              if(d.parsedExamples && d.parsedExamples.length){ example = stripHtml(d.parsedExamples[0].example); }
              else if(d.examples && d.examples.length){ example = stripHtml(d.examples[0]); }
              return { definition: stripHtml(d.definition), example: example };
            }).filter(function(d){ return d.definition; }),
            synonyms: []
          };
        }).filter(function(m){ return m.definitions.length; });
        if(!meanings.length){ return {status:"not-found"}; }
        return { status:"found", entry: { word: word, phonetic:"", audio:"", meanings: meanings } };
      });
    }).catch(function(){ return {status:"error"}; });
  }

  function fetchDictApi(word, lang){
    var url = "https://api.dictionaryapi.dev/api/v2/entries/" + apiCodeForLang(lang) + "/" + encodeURIComponent(word);
    return fetch(url).then(function(res){
      if(!res.ok){ return {status:"not-found"}; }
      return res.json().then(function(data){
        var e = data[0];
        // dictionaryapi.dev serves several recordings per word, named "..._gb_1.mp3",
        // "..._us_1.mp3" etc. Prefer British; fall back to whatever exists.
        var audio = "", audioAccent = "";
        var phonetic = "", phoneticGb = "";
        (e.phonetics || []).forEach(function(p){
          var src = p.audio || "";
          var isGb = /-gb|_gb|\/uk\//i.test(src);
          if(src){
            if(isGb && audioAccent !== "British"){
              // British always wins, even if a US recording was seen first.
              audio = src; audioAccent = "British";
            } else if(!audio){
              audio = src; audioAccent = /-us|_us/i.test(src) ? "American" : "";
            }
          }
          if(p.text){
            if(isGb && !phoneticGb){ phoneticGb = p.text; }
            if(!phonetic){ phonetic = p.text; }
          }
        });
        phonetic = phoneticGb || e.phonetic || phonetic;

        var meanings = (e.meanings || []).map(function(m){
          return {
            partOfSpeech: m.partOfSpeech,
            definitions: (m.definitions || []).slice(0,4).map(function(d){
              return { definition: d.definition, example: d.example || "" };
            }),
            synonyms: (m.synonyms || []).slice(0,6)
          };
        });
        return { status:"found", entry: {
          word: e.word, phonetic: phonetic, audio: audio,
          audioAccent: audioAccent, meanings: meanings
        } };
      });
    }).catch(function(){ return {status:"error"}; });
  }

  // IPA fallback when dictionaryapi.dev has no entry. Datamuse returns the
  // pronunciation in the tags array prefixed with "pron:", plus syllable count.
  function fetchIpa(word){
    var url = "https://api.datamuse.com/words?sp=" + encodeURIComponent(word) + "&qe=sp&md=rs&ipa=1&max=1";
    return fetch(url).then(function(r){ return r.ok ? r.json() : []; }).then(function(list){
      if(!list.length){ return {}; }
      var tags = list[0].tags || [];
      var out = { syllables: list[0].numSyllables };
      tags.forEach(function(t){
        if(t.indexOf("pron:") === 0){ out.phonetic = "/" + t.slice(5) + "/"; }
      });
      return out;
    }).catch(function(){ return {}; });
  }

  // ---- British voice, spoken on the device. Works with no network at all, and
  // covers every word — including ones with no recording on dictionaryapi.dev.
  var britishVoice = null;
  function pickBritishVoice(){
    if(!("speechSynthesis" in window)){ return null; }
    var voices = window.speechSynthesis.getVoices() || [];
    // Exact en-GB first, then any English voice with a British-sounding name.
    britishVoice = voices.filter(function(v){ return /^en[-_]GB$/i.test(v.lang); })[0]
                || voices.filter(function(v){ return /en[-_]GB/i.test(v.lang); })[0]
                || voices.filter(function(v){ return /UK English|British|Daniel|Serena|Kate|Arthur/i.test(v.name); })[0]
                || null;
    return britishVoice;
  }
  if("speechSynthesis" in window){
    pickBritishVoice();
    // Android populates the voice list asynchronously.
    window.speechSynthesis.onvoiceschanged = pickBritishVoice;
  }

  function speak(word){
    if(!("speechSynthesis" in window)){ return false; }
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(word);
      u.lang = "en-GB";
      var v = britishVoice || pickBritishVoice();
      if(v){ u.voice = v; }
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }

  // Datamuse: word relationships. Free and keyless today; Datamuse has announced
  // that an API key will be required from 1 Jan 2027. It is deliberately used
  // only for extras, never for the definition itself, so when that day comes the
  // app keeps working and just loses the related-words strip.
  function fetchRelated(word){
    var base = "https://api.datamuse.com/words?max=8&";
    function q(param){
      return fetch(base + param + "=" + encodeURIComponent(word))
        .then(function(r){ return r.ok ? r.json() : []; })
        .then(function(list){ return list.map(function(x){ return x.word; }); })
        .catch(function(){ return []; });
    }
    return Promise.all([q("rel_syn"), q("rel_ant"), q("rel_trg")]).then(function(r){
      return { synonyms: r[0], antonyms: r[1], related: r[2] };
    }).catch(function(){ return { synonyms:[], antonyms:[], related:[] }; });
  }

  // Spelling suggestions when nothing matches.
  function fetchSuggestions(word){
    return fetch("https://api.datamuse.com/sug?max=6&s=" + encodeURIComponent(word))
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(list){
        return list.map(function(x){ return x.word; })
                   .filter(function(w){ return w.toLowerCase() !== word.toLowerCase(); });
      })
      .catch(function(){ return []; });
  }

  // Merge: Wiktionary's definitions win; dictionaryapi.dev contributes IPA/audio
  // and fills in any part of speech Wiktionary didn't cover.
  function mergeEntries(wikt, dict, word){
    var base = null;
    if(wikt && wikt.status === "found"){
      base = wikt.entry;
      base.source = "Wiktionary";
    }
    if(dict && dict.status === "found"){
      if(!base){
        base = dict.entry;
        base.source = "dictionaryapi.dev";
      } else {
        base.phonetic = base.phonetic || dict.entry.phonetic;
        base.audio = base.audio || dict.entry.audio;
        var have = {};
        base.meanings.forEach(function(m){ have[(m.partOfSpeech||"").toLowerCase()] = true; });
        dict.entry.meanings.forEach(function(m){
          if(!have[(m.partOfSpeech||"").toLowerCase()]){ base.meanings.push(m); }
        });
        base.source = "Wiktionary + dictionaryapi.dev";
      }
    }
    if(base && !base.word){ base.word = word; }
    return base;
  }

  function lookup(word, lang){
    word = (word || "").trim();
    if(!word){ return; }
    lang = lang || langSelect.value;

    var offlineShown = false;

    // Kick off the online requests immediately — they're the slow part, so they
    // must not wait on the offline read.
    var onlinePromise = (navigator.onLine === false) ? null : Promise.all([
      fetchWiktionary(word, lang),
      fetchDictApi(word, lang),
      fetchRelated(word),
      fetchIpa(word)
    ]);

    // Offline shard usually resolves in a few milliseconds — paint it at once.
    fetchLocal(word, lang).then(function(local){
      if(local.status === "found" && !offlineShown){
        offlineShown = true;
        renderEntry(local.entry, lang, {
          showSave: true,
          pending: onlinePromise !== null
        });
      } else if(!offlineShown && onlinePromise){
        resultSlot.innerHTML = '<p class="status">Looking up \u201c' + escapeHtml(word) + '\u201d\u2026</p>';
      }
    });

    if(!onlinePromise){
      // Offline device: whatever the local copy gave us is the whole answer.
      fetchLocal(word, lang).then(function(local){
        if(local.status !== "found"){
          resultSlot.innerHTML = '<p class="status error">You\u2019re offline and \u201c' + escapeHtml(word) + '\u201d isn\u2019t in the downloaded dictionary.</p>';
          currentEntryData = null;
        }
      });
      return;
    }

    onlinePromise.then(function(res){
      var merged = mergeEntries(res[0], res[1], word);
      var related = res[2];
      var ipa = res[3] || {};

      if(merged){
        merged.related = related;
        if(!merged.phonetic && ipa.phonetic){ merged.phonetic = ipa.phonetic; }
        if(ipa.syllables){ merged.syllables = ipa.syllables; }
        if(offlineShown){
          appendOnlineEntry(merged, lang);
        } else {
          renderEntry(merged, lang, { showSave: true });
        }
        return;
      }

      // Online found nothing.
      if(offlineShown){
        var note = document.getElementById("pending-note");
        if(note){ note.textContent = "No additional entry found online."; }
        return;
      }

      var networkDown = res[0].status === "error" && res[1].status === "error";
      return fetchSuggestions(word).then(function(suggestions){
        if(networkDown && !suggestions.length){
          resultSlot.innerHTML = '<p class="status error">Couldn\u2019t reach any dictionary. Check your connection and try again.</p>';
        } else if(suggestions.length){
          var html = '<p class="status error">No entry for \u201c' + escapeHtml(word) + '\u201d. Did you mean:</p><div class="suggestions">';
          suggestions.forEach(function(s){
            html += '<button class="suggestion" data-word="' + escapeHtml(s) + '">' + escapeHtml(s) + '</button>';
          });
          html += '</div>';
          resultSlot.innerHTML = html;
          Array.prototype.forEach.call(resultSlot.querySelectorAll(".suggestion"), function(b){
            b.addEventListener("click", function(){
              searchInput.value = b.getAttribute("data-word");
              lookup(b.getAttribute("data-word"), lang);
            });
          });
        } else {
          resultSlot.innerHTML = '<p class="status error">No entry found for \u201c' + escapeHtml(word) + '\u201d.</p>';
        }
        currentEntryData = null;
      });
    });
  }

  function checkProtocolWarning(){
    if(window.location.protocol === "file:"){
      document.getElementById("protocol-warning-slot").innerHTML =
        '<div class="shared-note" style="border:1px solid var(--danger); color:var(--danger);">Opened as a local file — dictionary lookups and the share sheet won\u2019t work here. Open Kosh from its deployed https:// link instead.</div>';
    }
  }

  // Builds the markup for one entry. Used for both the instant offline block and
  // the online block that lands underneath it a moment later.
  function buildEntryHtml(entry, opts){
    opts = opts || {};
    var phonetic = entry.phonetic || "";
    var audio = entry.audio || "";
    var meanings = entry.meanings || [];

    var html = '<div class="entry' + (opts.compact ? ' entry-compact' : '') + '">';

    var pronBits = "";
    if(phonetic){ pronBits += '<span class="entry-phon">' + escapeHtml(phonetic) + '</span>'; }
    if(entry.syllables){ pronBits += '<span class="syllables">' + entry.syllables + (entry.syllables === 1 ? " syllable" : " syllables") + '</span>'; }
    // The button is always offered: with a recording when one exists, otherwise
    // the phone's own British voice, which also works with no signal.
    pronBits += '<button class="audio-btn" data-role="speak" title="Hear it in British English">\u25B6</button>';
    if(entry.audio && entry.audioAccent){
      pronBits += '<span class="accent-tag">' + escapeHtml(entry.audioAccent) + '</span>';
    }

    if(!opts.hideHead){
      html += '<div class="entry-head"><h2 class="entry-word">' + escapeHtml(entry.word) + '</h2>' + pronBits + '</div>';
    } else if(pronBits){
      html += '<div class="entry-head">' + pronBits + '</div>';
    }

    meanings.forEach(function(m){
      html += '<div class="pos">' + escapeHtml(m.partOfSpeech || "") + '</div>';
      html += '<ol class="defs">';
      (m.definitions || []).forEach(function(d){
        html += '<li>' + escapeHtml(d.definition);
        if(d.example){ html += '<div class="example">\u201c' + escapeHtml(d.example) + '\u201d</div>'; }
        html += '</li>';
      });
      html += '</ol>';
      if(m.synonyms && m.synonyms.length){
        html += '<div class="synonyms"><b>Synonyms:</b> ' + m.synonyms.map(escapeHtml).join(", ") + '</div>';
      }
    });

    var rel = entry.related || {};
    function relGroup(label, list){
      if(!list || !list.length){ return ""; }
      var out = '<div class="rel-group"><span class="rel-label">' + label + '</span><div class="rel-words">';
      list.forEach(function(w){
        out += '<button class="rel-word" data-word="' + escapeHtml(w) + '">' + escapeHtml(w) + '</button>';
      });
      return out + '</div></div>';
    }
    var relHtml = relGroup("Similar", rel.synonyms) + relGroup("Opposite", rel.antonyms) + relGroup("Associated", rel.related);
    if(relHtml){ html += '<div class="rel-block">' + relHtml + '</div>'; }

    if(entry.source){
      html += '<div class="source-tag">Source: ' + escapeHtml(entry.source === "offline" ? "offline dictionary on this phone" : entry.source) + '</div>';
    }
    if(opts.showSave){
      html += '<button class="save-btn saved" data-role="save">Saved for review \u2014 tap to remove</button>';
    }
    html += '</div>';
    return html;
  }

  // Attaches handlers to whatever was just inserted into `container`.
  function bindEntry(container, entry, lang){
    var audio = entry.audio || "";
    var word = entry.word || "";
    Array.prototype.forEach.call(container.querySelectorAll('[data-role="speak"]'), function(b){
      b.addEventListener("click", function(){
        if(audio){
          audioPlayer.src = audio;
          // If the recording won't load, speak it instead rather than doing nothing.
          audioPlayer.onerror = function(){ speak(word); };
          var p = audioPlayer.play();
          if(p && p.catch){ p.catch(function(){ speak(word); }); }
        } else {
          speak(word);
        }
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll(".rel-word"), function(b){
      b.addEventListener("click", function(){
        var w = b.getAttribute("data-word");
        searchInput.value = w;
        lookup(w, lang);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('[data-role="save"]'), function(b){
      b.addEventListener("click", function(){
        if(!currentEntryData){ return; }
        var id = wordId(currentEntryData.word, currentEntryData.lang);
        var idx = words.findIndex(function(w){ return w.id === id; });
        if(idx >= 0){
          words.splice(idx, 1);
          saveWords(words);
          b.textContent = "Save for later";
          b.classList.remove("saved");
        } else {
          saveEntry(currentEntryData, currentEntryData.lang);
          b.textContent = "Saved for review \u2014 tap to remove";
          b.classList.add("saved");
        }
        updateDueBadge();
      });
    });
  }

  // Full replace — used when there's nothing on screen yet.
  function renderEntry(entry, lang, opts){
    opts = opts || {};
    currentEntryData = {
      word: entry.word,
      lang: lang,
      phonetic: entry.phonetic || "",
      audio: entry.audio || "",
      audioAccent: entry.audioAccent || "",
      syllables: entry.syllables || null,
      meanings: entry.meanings || []
    };
    saveEntry(currentEntryData, lang);

    resultSlot.innerHTML = buildEntryHtml(entry, {
      showSave: opts.showSave !== false
    });
    if(opts.pending){
      resultSlot.insertAdjacentHTML("beforeend",
        '<div class="pending-note" id="pending-note">Checking Wiktionary for a fuller entry\u2026</div>');
    }
    bindEntry(resultSlot, entry, lang);
  }

  // Appends the online entry below the offline one, separated by a rule.
  function appendOnlineEntry(entry, lang){
    var note = document.getElementById("pending-note");
    if(note){ note.parentNode.removeChild(note); }

    var block = document.createElement("div");
    block.className = "online-block";
    block.innerHTML = '<div class="block-divider"><span>' + escapeHtml(entry.source || "Online") + '</span></div>'
                    + buildEntryHtml(entry, { hideHead: true, showSave: true });
    resultSlot.appendChild(block);

    // Upgrade what's stored: the online entry is richer than the offline stub.
    var id = wordId(entry.word, lang);
    var existing = words.find(function(w){ return w.id === id; });
    if(existing){
      existing.meanings = entry.meanings || existing.meanings;
      existing.phonetic = entry.phonetic || existing.phonetic || "";
      existing.audio = entry.audio || existing.audio || "";
      existing.syllables = entry.syllables || existing.syllables || null;
      saveWords(words);
    }
    currentEntryData = {
      word: entry.word, lang: lang,
      phonetic: entry.phonetic || "", audio: entry.audio || "",
      audioAccent: entry.audioAccent || "", syllables: entry.syllables || null,
      meanings: entry.meanings || []
    };
    bindEntry(block, entry, lang);
  }

  function saveEntry(entry, lang){
    var id = wordId(entry.word, lang);
    if(words.some(function(w){ return w.id === id; })){ return false; }
    words.push({
      id: id,
      word: entry.word,
      lang: lang,
      phonetic: entry.phonetic || "",
      audio: entry.audio || "",
      meanings: entry.meanings || [],
      savedAt: Date.now(),
      box: 1,
      nextReview: Date.now(),
      lastReviewed: null
    });
    saveWords(words);
    updateDueBadge();
    return true;
  }

  function toggleSaveCurrent(){
    if(!currentEntryData){ return; }
    var id = wordId(currentEntryData.word, currentEntryData.lang);
    var idx = words.findIndex(function(w){ return w.id === id; });
    if(idx >= 0){
      words.splice(idx, 1);
      saveWords(words);
    } else {
      saveEntry(currentEntryData, currentEntryData.lang);
    }
    var savedNow = idx < 0;
    var btn = document.getElementById("save-btn");
    btn.textContent = savedNow ? "Saved for review — tap to remove" : "Save for later";
    btn.classList.toggle("saved", savedNow);
    updateDueBadge();
  }

  searchBtn.addEventListener("click", function(){ lookup(searchInput.value); });
  searchInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ lookup(searchInput.value); }
  });

  // ---------- saved / study view ----------
  var savedCountEl = document.getElementById("saved-count");
  var savedListSlot = document.getElementById("saved-list-slot");
  var startReviewBtn = document.getElementById("start-review-btn");
  var filterInput = document.getElementById("filter-input");
  var dueBadge = document.getElementById("due-badge");

  function dueWords(){
    var now = Date.now();
    return words.filter(function(w){ return w.nextReview <= now; });
  }

  function updateDueBadge(){
    var n = dueWords().length;
    dueBadge.textContent = n > 0 ? "(" + n + ")" : "";
    startReviewBtn.disabled = n === 0;
    savedCountEl.innerHTML = words.length + (words.length === 1 ? " word saved" : " words saved") +
      (n > 0 ? " · <b>" + n + " due</b>" : "");
  }

  function dateHeading(ts){
    var d = new Date(ts);
    var today = new Date();
    var startOfDay = function(x){ return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var diffDays = Math.round((startOfDay(today) - startOfDay(d)) / 86400000);
    if(diffDays === 0){ return "Today"; }
    if(diffDays === 1){ return "Yesterday"; }
    if(diffDays < 7){
      return d.toLocaleDateString(undefined, { weekday:"long" });
    }
    if(d.getFullYear() === today.getFullYear()){
      return d.toLocaleDateString(undefined, { day:"numeric", month:"long" });
    }
    return d.toLocaleDateString(undefined, { day:"numeric", month:"long", year:"numeric" });
  }

  function renderSavedList(){
    updateDueBadge();
    var filter = filterInput.value.trim().toLowerCase();
    var list = words.slice().sort(function(a,b){ return b.savedAt - a.savedAt; });
    if(filter){
      list = list.filter(function(w){ return w.word.toLowerCase().indexOf(filter) >= 0; });
    }
    if(list.length === 0){
      savedListSlot.innerHTML = words.length === 0
        ? '<div class="empty-state"><p>Nothing saved yet. Look up a word — it\u2019s kept here automatically. You can also select text anywhere on your phone and share it to Kosh.</p></div>'
        : '<div class="empty-state"><p>No saved words match that filter.</p></div>';
      return;
    }
    var now = Date.now();
    var html = "";
    var currentHeading = null;

    list.forEach(function(w){
      var heading = dateHeading(w.savedAt);
      if(heading !== currentHeading){
        if(currentHeading !== null){ html += '</ul>'; }
        currentHeading = heading;
        html += '<div class="date-heading">' + escapeHtml(heading) + '</div><ul class="word-list">';
      }
      var isDue = w.nextReview <= now;
      var firstPos = w.meanings && w.meanings[0] ? w.meanings[0].partOfSpeech : "";
      html += '<li class="word-row" data-id="' + w.id + '">';
      html += '<div class="word-row-head">';
      html += '<div class="word-row-left"><span class="box-dot' + (isDue ? ' due' : '') + '"></span>';
      html += '<div><div class="word-row-word">' + escapeHtml(w.word) + '</div>';
      html += '<div class="word-row-pos">' + escapeHtml(firstPos || "") + '</div></div></div>';
      html += '<div class="word-row-actions">';
      html += '<button class="audio-btn small" data-speak="' + w.id + '" title="Hear it">▶</button>';
      html += '<button class="word-row-del" data-id="' + w.id + '">Remove</button>';
      html += '</div>';
      html += '</div>';
      html += '<div class="word-row-body">' + renderMeaningsHtml(w.meanings) + '</div>';
      html += '</li>';
    });
    if(currentHeading !== null){ html += '</ul>'; }
    savedListSlot.innerHTML = html;

    Array.prototype.forEach.call(savedListSlot.querySelectorAll(".word-row-head"), function(el){
      el.addEventListener("click", function(e){
        if(e.target.classList.contains("word-row-del")){ return; }
        if(e.target.hasAttribute && e.target.hasAttribute("data-speak")){ return; }
        var row = el.closest(".word-row");
        var body = row.querySelector(".word-row-body");
        body.classList.toggle("open");
      });
    });
    Array.prototype.forEach.call(savedListSlot.querySelectorAll("[data-speak]"), function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        speakSaved(el.getAttribute("data-speak"));
      });
    });
    Array.prototype.forEach.call(savedListSlot.querySelectorAll(".word-row-del"), function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var id = el.getAttribute("data-id");
        words = words.filter(function(w){ return w.id !== id; });
        saveWords(words);
        renderSavedList();
      });
    });
  }

  function renderMeaningsHtml(meanings){
    var html = "";
    (meanings || []).forEach(function(m){
      html += '<div class="pos">' + escapeHtml(m.partOfSpeech || "") + '</div>';
      html += '<ol class="defs">';
      (m.definitions || []).forEach(function(d){
        html += '<li>' + escapeHtml(d.definition);
        if(d.example){ html += '<div class="example">“' + escapeHtml(d.example) + '”</div>'; }
        html += '</li>';
      });
      html += '</ol>';
      if(m.synonyms && m.synonyms.length){
        html += '<div class="synonyms"><b>Synonyms:</b> ' + m.synonyms.map(escapeHtml).join(", ") + '</div>';
      }
    });
    return html;
  }

  // Plays a saved word: its recording if one was captured, else the British voice.
  function speakSaved(id){
    var w = words.find(function(x){ return x.id === id; });
    if(!w){ return; }
    if(w.audio){
      audioPlayer.src = w.audio;
      audioPlayer.onerror = function(){ speak(w.word); };
      var p = audioPlayer.play();
      if(p && p.catch){ p.catch(function(){ speak(w.word); }); }
    } else {
      speak(w.word);
    }
  }

  filterInput.addEventListener("input", renderSavedList);

  // ---------- review (flashcards) ----------
  var overlay = document.getElementById("review-overlay");
  var reviewProgress = document.getElementById("review-progress");
  var reviewBodySlot = document.getElementById("review-body-slot");
  var reviewCloseBtn = document.getElementById("review-close");

  var reviewQueue = [];
  var reviewIndex = 0;
  var reviewFlipped = false;

  function startReview(){
    reviewQueue = dueWords().slice();
    reviewIndex = 0;
    if(reviewQueue.length === 0){ return; }
    overlay.classList.add("active");
    renderReviewStep();
  }

  function renderReviewStep(){
    if(reviewIndex >= reviewQueue.length){
      reviewBodySlot.innerHTML = '<div class="review-done"><p class="brand"><b>Kosh</b></p><p>Review done. ' + reviewQueue.length + ' word' + (reviewQueue.length===1?'':'s') + ' reviewed.</p></div>';
      reviewProgress.textContent = "";
      return;
    }
    reviewFlipped = false;
    var w = reviewQueue[reviewIndex];
    reviewProgress.textContent = (reviewIndex+1) + " / " + reviewQueue.length;

    var html = '<div class="review-card" id="review-card">';
    html += '<div class="review-word">' + escapeHtml(w.word) + '</div>';
    html += '<button class="audio-btn review-speak" id="review-speak" title="Hear it">▶</button>';
    html += '<div class="review-hint" id="review-hint">Tap the card to reveal the definition</div>';
    html += '<div class="review-back" id="review-back">' + renderMeaningsHtml(w.meanings) + '</div>';
    html += '</div>';
    html += '<div class="review-buttons" id="review-buttons" style="visibility:hidden;">';
    html += '<button class="btn-again" id="btn-again">Still learning</button>';
    html += '<button class="btn-good" id="btn-good">Got it</button>';
    html += '</div>';
    reviewBodySlot.innerHTML = html;

    document.getElementById("review-card").addEventListener("click", function(){
      if(reviewFlipped){ return; }
      reviewFlipped = true;
      document.getElementById("review-back").classList.add("show");
      document.getElementById("review-hint").style.display = "none";
      document.getElementById("review-buttons").style.visibility = "visible";
    });
    document.getElementById("review-speak").addEventListener("click", function(e){
      e.stopPropagation();
      speakSaved(w.id);
    });
    document.getElementById("btn-again").addEventListener("click", function(){ answerReview(false); });
    document.getElementById("btn-good").addEventListener("click", function(){ answerReview(true); });
  }

  function answerReview(good){
    var w = reviewQueue[reviewIndex];
    var master = words.find(function(x){ return x.id === w.id; });
    if(master){
      if(good){
        master.box = Math.min(5, (master.box || 1) + 1);
      } else {
        master.box = 1;
      }
      master.lastReviewed = Date.now();
      var days = BOX_INTERVAL_DAYS[master.box] || 0;
      master.nextReview = Date.now() + days * 24 * 60 * 60 * 1000;
      saveWords(words);
    }
    reviewIndex++;
    renderReviewStep();
  }

  reviewCloseBtn.addEventListener("click", function(){
    overlay.classList.remove("active");
    renderSavedList();
  });
  startReviewBtn.addEventListener("click", startReview);

  // ---------- share target handling ----------
  function handleShareParams(){
    var params = new URLSearchParams(window.location.search);
    var sharedText = params.get("text") || params.get("title") || "";
    if(!sharedText){ return; }
    var match = sharedText.match(/[A-Za-z\u0900-\u097F'-]{2,}/);
    var query = match ? match[0] : sharedText.trim();
    var noteSlot = document.getElementById("shared-note-slot");
    noteSlot.innerHTML = '<div class="shared-note">Shared to Kosh: “' + escapeHtml(sharedText.length > 80 ? sharedText.slice(0,80)+"…" : sharedText) + '” — looking up “' + escapeHtml(query) + '”.</div>';
    searchInput.value = query;
    // guess language: if text contains Devanagari, use Hindi
    if(/[\u0900-\u097F]/.test(sharedText)){ langSelect.value = "hi"; }
    lookup(query, langSelect.value);
    history.replaceState({}, "", window.location.pathname);
  }

  // ---------- service worker ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }

  applyTheme((function(){
    try{ return localStorage.getItem(THEME_KEY) || "paper"; }catch(e){ return "paper"; }
  })());
  updateDueBadge();
  checkProtocolWarning();
  refreshOfflineStatus();
  handleShareParams();
})();
</script>
</body>
</html>
